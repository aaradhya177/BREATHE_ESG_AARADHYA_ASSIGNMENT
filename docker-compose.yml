services:
  postgres:
    image: postgres:16
    container_name: breathe-esg-postgres
    environment:
      POSTGRES_DB: breathe_esg
      POSTGRES_USER: breathe
      POSTGRES_PASSWORD: breathe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breathe -d breathe_esg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
